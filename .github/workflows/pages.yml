# 部署到 GitHub Pages（静态托管 + 公共 MQTT 中继联机，无需服务器）
# 使用前：仓库 Settings → Pages → Build and deployment → Source 选择 “GitHub Actions”，
# 然后在 Actions 页面手动运行本工作流（或再推送一次）。
name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check whether Pages is enabled
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ] && gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages 尚未启用（或非默认分支），本次只做构建与测试。启用方法：Settings → Pages → Source 选择 GitHub Actions。"
          fi
      - if: steps.check.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - if: steps.check.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
